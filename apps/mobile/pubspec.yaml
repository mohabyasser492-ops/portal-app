name: portal_app
description: Standalone Arabic-first employee portal
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.3
  connectivity_plus: ^6.1.5

  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1

  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  file_picker: ^12.0.0
  msal_auth: 3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true