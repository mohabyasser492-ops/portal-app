name: portal_app
description: Standalone Arabic-first employee portal
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.7.0

  flutter_secure_storage: 10.3.1
  intl: 0.20.3
  connectivity_plus: ^7.3.1

  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  file_picker: ^12.0.0

  msal_auth: 3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  freezed: ^4.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/msal_config.json